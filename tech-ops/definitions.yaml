dsl_definitions:

  # For the nodes that only do something when the deployment is installed: they
  # never drift, so an update never re-runs the installer or its checks.
  no_drift: &no_drift
    implementation: tech-ops/scripts/no_drift.py
    executor: central_deployment_agent

# The fabric plugin passes process.env as unquoted `export NAME=value`, so every
# text value is wrapped in single quotes here, and the inputs refuse a single
# quote. Numbers and booleans need no quotes. An optional text input cleared in
# the form arrives as null, so those go through `[0] || ''`: the installer then
# uses its default.
  install_task: &install_task
    concat: ["'", { jmespath: ["[0] || 'install'", [{ get_input: run_arg }]] }, "'"]

  # The data paths and the local-path switch also go to stop, so an uninstall
  # removes custom paths.
  rke2_paths_env: &rke2_paths_env
    RKE2_DATA: { concat: ["'", { get_input: rke2_data }, "'"] }
    KUBELET_DATA: { concat: ["'", { get_input: kubelet_data }, "'"] }
    PVC_DATA: { concat: ["'", { get_input: pvc_data }, "'"] }
    INSTALL_LOCAL_PATH_PROVISIONER: { get_input: install_local_path_provisioner }

  rke2_env: &rke2_env
    <<: *rke2_paths_env
    # RKE2 Cluster Config
    RKE2_VERSION: { concat: ["'", { get_input: rke2_version }, "'"] }
    CNI_TYPE: { concat: ["'", { get_input: cni_type }, "'"] }
    ENABLE_CIS: { get_input: enable_cis }
    CLUSTER_CIDR: { concat: ["'", { get_input: cluster_cidr }, "'"] }
    SERVICE_CIDR: { concat: ["'", { get_input: service_cidr }, "'"] }
    MAX_PODS: { get_input: max_pods }
    INSTALL_INGRESS: { get_input: install_ingress }
    INSTALL_SERVICELB: { get_input: install_servicelb }
    LOCAL_PATH_PROVISIONER_VERSION: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: local_path_provisioner_version }]] }, "'"] }
    INSTALL_DNS_UTILITY: { get_input: install_dns_utility }
    CONTROL_PLANE_TAINT: { get_input: control_plane_taint }
    DEBUG: { get_input: debug }
    # Online, ignore an rke2-save-version.txt that an earlier save left in the
    # home directory: it would switch the installer to air-gapped mode.
    RKE2_FORCE_ONLINE: { jmespath: ["[0] && 'false' || 'true'", [{ get_input: offline_mode }]] }
    # Velero
    VELERO_VERSION: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: velero_version }]] }, "'"] }
    VELERO_AWS_PLUGIN_VERSION: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: velero_aws_plugin_version }]] }, "'"] }
    VELERO_S3_URL: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: velero_s3_url }]] }, "'"] }
    VELERO_S3_ACCESS_KEY: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: velero_s3_access_key }]] }, "'"] }
    VELERO_S3_SECRET_KEY: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: velero_s3_secret_key }]] }, "'"] }
    VELERO_BUCKET: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: velero_bucket }]] }, "'"] }
    VELERO_BACKUP_NAMESPACES: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: velero_backup_namespaces }]] }, "'"] }
    VELERO_BACKUP_SCHEDULE: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: velero_backup_schedule }]] }, "'"] }
    VELERO_BACKUP_TTL: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: velero_backup_ttl }]] }, "'"] }
    VSC_NAME: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: vsc_name }]] }, "'"] }
    VSC_DRIVER: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: vsc_driver }]] }, "'"] }
    PUSH_SAVE_VELERO: { get_input: push_save_velero }
    # Monitoring
    MONITORING_HOST: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: monitoring_host }]] }, "'"] }
    MONITORING_LOKI_PORT: { get_input: monitoring_loki_port }
    MONITORING_PROMETHEUS_PORT: { get_input: monitoring_prometheus_port }
    CLUSTER_NAME: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: cluster_name }]] }, "'"] }
    HELM_VERSION: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: helm_version }]] }, "'"] }
    KUBE_PROMETHEUS_STACK_VERSION: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: kube_prometheus_stack_version }]] }, "'"] }
    FLUENT_BIT_CHART_VERSION: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: fluent_bit_chart_version }]] }, "'"] }
    FLUENT_BIT_VERSION: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: fluent_bit_version }]] }, "'"] }
    PROMETHEUS_RETENTION: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: prometheus_retention }]] }, "'"] }
    PROMETHEUS_STORAGE_SIZE: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: prometheus_storage_size }]] }, "'"] }
    PROMETHEUS_STORAGE_CLASS: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: prometheus_storage_class }]] }, "'"] }
    MONITOR_EXCLUDE_NS: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: monitor_exclude_ns }]] }, "'"] }
    MONITOR_PORT_NAMES: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: monitor_port_names }]] }, "'"] }
    MONITOR_CONFIGS_DIR: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: monitor_configs_dir }]] }, "'"] }
    PUSH_SAVE_MONITORING: { get_input: push_save_monitoring }

  # SSH through the Endpoint proxy to the VM this deployment is deployed on.
  vm_fabric_env: &vm_fabric_env
    host_string: { get_environment_capability: vm_name_id }
    user: { get_environment_capability: vm_user_name }
    key: { get_secret: { get_environment_capability: vm_ssh_private_key } }
    port: 22

  vm_proxy_settings: &vm_proxy_settings
    auto_resolve: false
    enable_socks5: false
    target_id: { get_environment_capability: proxy_target_id }
    target_ip: { get_environment_capability: vm_name_id }

# Get VM info
  get_vm_info_inputs: &get_vm_info_inputs
    script_path: tech-ops/scripts/get_vm_info.sh
    fabric_env: *vm_fabric_env
    hide_output: { get_input: hide_log_output }
    proxy_settings: *vm_proxy_settings

node_templates:

  vm_info:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        start:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs: *get_vm_info_inputs
        update:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs: *get_vm_info_inputs

  # A failed script exits 1 and isn't retried: a retry of install_app would
  # re-run the installer for a long time.
  env_precheck:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: tech-ops/scripts/env_precheck.sh
            process:
              env:
                OFFLINE_MODE: { get_input: offline_mode }
                OFFLINE_BINARY_URL: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: offline_binary_url }]] }, "'"] }
                OFFLINE_BINARY_USER: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: offline_binary_access_user }]] }, "'"] }
                OFFLINE_BINARY_PASSWORD: { concat: ["'", { get_secret: [ { get_input: offline_binary_secret }, binary_image_access_token ] }, "'"] }
                SCRIPT_URL: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: script_url }]] }, "'"] }
            fabric_env: *vm_fabric_env
            hide_output: { get_input: hide_log_output }
            proxy_settings: *vm_proxy_settings
            non_recoverable_error_exit_codes: [1]
        check_drift: *no_drift
    relationships:
       - type: dell.relationships.depends_on
         target: vm_info

  # Runs the installer for the Install Task (tech-ops/scripts/rke2_app.sh);
  # stop uninstalls RKE2 only when the deployment is uninstalled
  # (tech-ops/scripts/rke2_stop.sh).
  install_app:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          executor: central_deployment_agent
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: tech-ops/scripts/rke2_app.sh
            process:
              env:
                <<: *rke2_env
                RUN_ARG: *install_task
                TLS_SAN: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: tls_san }]] }, "'"] }
                JOIN_MODE: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: join_mode }]] }, "'"] }
                JOIN_SERVER: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: join_server }]] }, "'"] }
                JOIN_TOKEN: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: join_token }]] }, "'"] }
                REG_URL: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: registry_url }]] }, "'"] }
                REG_USER: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: registry_access_user }]] }, "'"] }
                REG_PASS: { concat: ["'", { get_secret: [ { get_input: registry_secret }, password ] }, "'"] }
            hide_output: { get_input: hide_log_output }
            proxy_settings: *vm_proxy_settings
            fabric_env: *vm_fabric_env
            non_recoverable_error_exit_codes: [1]
        check_drift: *no_drift
        stop:
          executor: central_deployment_agent
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: tech-ops/scripts/rke2_stop.sh
            process:
              env:
                <<: *rke2_paths_env
                RUN_ARG: *install_task
            hide_output: { get_input: hide_log_output }
            proxy_settings: *vm_proxy_settings
            fabric_env: *vm_fabric_env
    relationships:
       - type: dell.relationships.depends_on
         target: env_precheck

  env_postcheck:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: tech-ops/scripts/env_postcheck.sh
            process:
              env:
                RUN_ARG: *install_task
                RKE2_DATA: { concat: ["'", { get_input: rke2_data }, "'"] }
                UPLOAD_OFFLINE_PACKAGE: { get_input: upload_package }
                UPLOAD_BASE_URL: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: upload_binary_url }]] }, "'"] }
                UPLOAD_OFFLINE_PACKAGE_USER: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: upload_binary_access_user }]] }, "'"] }
                UPLOAD_OFFLINE_PACKAGE_PASSWORD: { concat: ["'", { get_secret: [ { get_input: upload_binary_secret }, binary_image_access_token ] }, "'"] }
            fabric_env: *vm_fabric_env
            hide_output: { get_input: hide_log_output }
            proxy_settings: *vm_proxy_settings
            non_recoverable_error_exit_codes: [1]
        check_drift: *no_drift
    relationships:
       - type: dell.relationships.depends_on
         target: install_app
