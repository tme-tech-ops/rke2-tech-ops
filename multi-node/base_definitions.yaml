dsl_definitions:

  # For nodes that only do something when the cluster is created (VM prep and
  # the RKE2 install nodes): they never drift, so a deployment update never
  # re-runs or reinstalls them. An update changes the VMs only.
  no_drift: &no_drift
    implementation: multi-node/scripts/no_drift.py
    executor: central_deployment_agent

  # stop of the RKE2 install nodes: uninstalls RKE2 only when the deployment is
  # uninstalled (or a node is scaled away). A reinstall or Heal keeps it.
  # See multi-node/scripts/rke2_stop.sh.
  rke2_stop_inputs: &rke2_stop_inputs
    script_path: multi-node/scripts/rke2_stop.sh
    hide_output: { get_input: hide_log_output }

# Base CP1 Environment Checks
  env_precheck_inputs: &env_precheck_inputs
    script_path: multi-node/scripts/env_precheck.sh
    process:
      env:
        OFFLINE_MODE: { get_input: offline_mode }
        OFFLINE_BINARY_URL: { get_input: offline_binary_url }
        OFFLINE_BINARY_USER: { get_input: offline_binary_access_user }
        OFFLINE_BINARY_PASSWORD: { get_secret: [ { get_input: offline_binary_secret }, binary_image_access_token ] }
        SCRIPT_URL: { get_input: script_url }
        TLS_SAN: { get_input: tls_san }
        REG_URL: { get_input: registry_url }
        REG_USER: { get_input: registry_access_user }
        REG_PASS: { concat: [ '"', { get_secret: [ { get_input: registry_secret }, password ] }, '"' ] }
        PUSH_IMAGES: { get_input: push_images }
    fabric_env:
      host_string: { get_attribute: [base_vm, capabilities, vm_name_id] }
      user: { get_input: cp_1_vm_user_name }
      key: { get_secret: { get_attribute: [base_vm, capabilities, vm_ssh_private_key] } }
      port: 22
    hide_output: { get_input: hide_log_output }
    proxy_settings:
      auto_resolve: false
      enable_socks5: false
      target_id: { get_attribute: [base_vm, capabilities, proxy_target_id] }
      target_ip: { get_attribute: [base_vm, capabilities, vm_name_id] }

  env_postcheck_inputs: &env_postcheck_inputs
    script_path: multi-node/scripts/env_postcheck.sh
    use_sudo: true
    process:
      env:
        SA_NAMESPACE: { get_input: sa_namespace }
    fabric_env:
      host_string: { get_attribute: [base_vm, capabilities, vm_name_id] }
      user: { get_input: cp_1_vm_user_name }
      key: { get_secret: { get_attribute: [base_vm, capabilities, vm_ssh_private_key] } }
      port: 22
    hide_output: { get_input: hide_log_output }
    proxy_settings:
      auto_resolve: false
      enable_socks5: false
      target_id: { get_attribute: [base_vm, capabilities, proxy_target_id] }
      target_ip: { get_attribute: [base_vm, capabilities, vm_name_id] }

# App deploy
  run_install_cmds: &run_install_cmds
    - concat: [ "sudo -E ./rke2_installer.sh ", { get_attribute: [ env_precheck, capabilities, install_cmd ] } ]

  shell_env: &shell_env
    RKE2_VERSION: { get_input: rke2_version }
    CNI_TYPE: { get_input: cni_type }
    ENABLE_CIS: { get_input: enable_cis }
    CLUSTER_CIDR: { get_input: cluster_cidr }
    SERVICE_CIDR: { get_input: service_cidr }
    MAX_PODS: { get_input: max_pods }
    INSTALL_INGRESS: { get_input: install_ingress }
    INSTALL_SERVICELB: { get_input: install_servicelb }
    INSTALL_LOCAL_PATH_PROVISIONER: { get_input: install_local_path_provisioner }
    LOCAL_PATH_PROVISIONER_VERSION: { get_input: local_path_provisioner_version }
    INSTALL_DNS_UTILITY: { get_input: install_dns_utility }
    RKE2_DATA: { get_input: rke2_data }
    KUBELET_DATA: { get_input: kubelet_data }
    PVC_DATA: { get_input: pvc_data }
    CONTROL_PLANE_TAINT: { get_input: control_plane_taint }
    DEBUG: { get_input: debug }

  command_fabric_env: &command_fabric_env
    shell_env:
      <<: *shell_env
    host_string: { get_attribute: [base_vm, capabilities, vm_name_id] }
    user: { get_input: cp_1_vm_user_name }
    key: { get_secret: { get_attribute: [base_vm, capabilities, vm_ssh_private_key] } }
    port: 22

node_templates:

  ssh_keys:
    type: dell.nodes.keys.RSAKey
    properties:
      use_secret_store: true
      use_secrets_if_exist: true
      key_name: "edge_key"
      resource_config:
        openssh_format: true
        key_name: "edge_key"
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: keys.ne_ssh_key.operations.create
          inputs:
            store_public_key_material: false
            store_private_key_material: false
        delete: {}

  binary_image:
    type: dell.nodes.nativeedge.template.BinaryImage
    properties:
      binary_image_config:
        artifact:
          path: { get_input: binary_image_url }
          username: { get_input: binary_image_access_user }
          access_token:
            get_secret:
              - get_input: edge_os_image_secret
              - binary_image_access_token
        version: { get_input: binary_image_version }
    interfaces:
      dell.interfaces.lifecycle:
        precreate:
          implementation:
            edge.nativeedge_plugin.tasks.validate_binary_image_config
        create:
          implementation:
            edge.nativeedge_plugin.tasks.upload_binary
        delete:
          implementation:
            edge.nativeedge_plugin.tasks.delete_binary

  # Builds the cloud-init config (first boot only) and CP1's NICs (fixed at
  # install). Everything an update can change is built in base_vm's own
  # properties from the inputs, because an update doesn't re-run this node.
  prep_config:
    type: dell.nodes.ApplicationModule
    interfaces:
      dell.interfaces.lifecycle:
        precreate:
          implementation: multi-node/scripts/prepare_base_vm_config.py
          executor: central_deployment_agent
          inputs:
            primary_segment: { get_input: cp_1_vnic_0_segment_name }
            vm_add_nics: { get_input: cp_1_vm_add_nics }
            use_dhcp: { get_input: cp_1_use_dhcp }
            static_ip: { get_input: cp_1_static_ip }
            use_gateway: { get_input: cp_1_use_gateway }
            gateway: { get_input: cp_1_gateway }
            use_dns: { get_input: cp_1_use_dns }
            dns: { get_input: cp_1_dns }
            vm_hostname: { get_input: cp_1_hostname }
            vm_user_name: { get_input: cp_1_vm_user_name }
            vm_password: { get_secret: { get_input: cp_1_vm_password } }
            ssh_public_key:
              get_secret:
                concat:
                  - get_attribute: [ssh_keys, secret_key_name]
                  - "_public"
            cloudinit_override: { get_input: cloudinit }
            cp_vcpus: { get_input: cp_vcpus }
            cp_memory_size: { get_input: cp_memory_size }
            cp_os_disk_size: { get_input: cp_os_disk_size }
        check_drift: *no_drift
    relationships:
      - type: dell.relationships.depends_on
        target: ssh_keys

  # CP1 is a deployment of the utility blueprint. On update, this component
  # compares the inputs below with the child's and updates the child with the
  # difference, so every value that can change is computed here from the inputs
  # (not read from prep_config). Lists are sent as [] rather than null, so a
  # no-change update finds no difference. With more than one control plane, CP1
  # keeps its install-time sizes (see multi-node/scripts/update_checks.py).
  base_vm:
    type: dell.nodes.ServiceComponent
    properties:
      resource_config:
        blueprint:
          external_resource: true
          id: { get_input: utility_blueprint_id }
          revision_id: { get_input: utility_blueprint_revision }
        deployment:
          display_name: { concat: ["utility-vm-", get_input: cp_1_vm_name] }
          inputs:
            service_tag: { get_environment_capability: ece_service_tag }
            name: { get_input: cp_1_vm_name }
            image: { get_attribute: [binary_image, binary_details, extra, artifact_id] }
            os_type: { get_input: os_type }
            cpu:
              jmespath:
                - "([0] > `1` && [2]) || [1]"
                - - { get_input: number_of_control_plane }
                  - { get_input: cp_vcpus }
                  - { get_attribute: [prep_config, cp_vcpus] }
            memory:
              jmespath:
                - "([0] > `1` && [2]) || [1]"
                - - { get_input: number_of_control_plane }
                  - { get_input: cp_memory_size }
                  - { get_attribute: [prep_config, cp_memory_size] }
            storage:
              jmespath:
                - "([0] > `1` && [2]) || [1]"
                - - { get_input: number_of_control_plane }
                  - { get_input: cp_os_disk_size }
                  - { get_attribute: [prep_config, cp_os_disk_size] }
            disk: { get_input: cp_1_disk_wrapper }
            disk_controller: { get_input: cp_disk_controller }
            hardware_options.vTPM: { get_input: vtpm }
            hardware_options.secure_boot: { get_input: secure_boot }
            hardware_options.firmware_type: { get_input: firmware_type }
            enable_management: { get_input: enable_management }
            network_settings: { get_attribute: [prep_config, network_settings] }
            cloudinit: { get_attribute: [prep_config, cloudinit_config] }
            vm_user_name: { get_input: cp_1_vm_user_name }
            ssh_private_key_secret:
              concat:
                - get_attribute: [ssh_keys, secret_key_name]
                - "_private"
            vm_hostname: { get_input: cp_1_hostname }
            # CP1's disks can change with any number of control planes: CP2-3
            # keep theirs, so at most one control plane restarts for a disk
            # change.
            additional_disks:
              jmespath:
                - "([0] && [1]) || `[]`"
                - - { get_input: cp_1_add_disks }
                  - { get_input: cp_1_additional_disks }
            usb:
              jmespath:
                - "([0] && [1]) || `[]`"
                - - { get_input: cp_1_use_passthrough }
                  - { get_input: cp_1_usb_wrapper }
            serial_port:
              jmespath:
                - "([0] && [1]) || `[]`"
                - - { get_input: cp_1_use_passthrough }
                  - { get_input: cp_1_serial_port_wrapper }
            gpu:
              jmespath:
                - "([0] && [1]) || `[]`"
                - - { get_input: cp_1_use_passthrough }
                  - { get_input: cp_1_gpu_wrapper }
            video:
              jmespath:
                - "([0] && [1]) || `[]`"
                - - { get_input: cp_1_use_passthrough }
                  - { get_input: cp_1_video }
            pcie:
              jmespath:
                - "([0] && [1]) || `[]`"
                - - { get_input: cp_1_use_passthrough }
                  - { get_input: cp_1_pcie_wrapper }
            iso_files: { get_input: iso_files }
            boot_order: { get_input: boot_order }
    relationships:
      - type: dell.relationships.depends_on
        target: prep_config
      - type: dell.relationships.depends_on
        target: binary_image
      - type: dell.relationships.depends_on
        target: ssh_keys

  env_precheck:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            <<: *env_precheck_inputs
        check_drift: *no_drift
    relationships:
       - type: dell.relationships.depends_on
         target: base_vm

  install_app:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          executor: central_deployment_agent
          implementation: fabric.fabric_plugin.tasks.run_commands
          inputs:
            hide_output: { get_input: hide_log_output }
            proxy_settings:
              auto_resolve: false
              enable_socks5: false
              target_id: { get_attribute: [base_vm, capabilities, proxy_target_id] }
              target_ip: { get_attribute: [base_vm, capabilities, vm_name_id] }
            commands: *run_install_cmds
            fabric_env:
              <<: *command_fabric_env
        check_drift: *no_drift
        stop:
          executor: central_deployment_agent
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            <<: *rke2_stop_inputs
            proxy_settings:
              auto_resolve: false
              enable_socks5: false
              target_id: { get_attribute: [base_vm, capabilities, proxy_target_id] }
              target_ip: { get_attribute: [base_vm, capabilities, vm_name_id] }
            fabric_env:
              host_string: { get_attribute: [base_vm, capabilities, vm_name_id] }
              user: { get_input: cp_1_vm_user_name }
              key: { get_secret: { get_attribute: [base_vm, capabilities, vm_ssh_private_key] } }
              port: 22
    relationships:
       - type: dell.relationships.depends_on
         target: env_precheck

  env_postcheck:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            <<: *env_postcheck_inputs
        check_drift: *no_drift
    relationships:
       - type: dell.relationships.depends_on
         target: install_app
